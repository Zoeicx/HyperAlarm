name: "✨ Feature request"
description: Suggest an idea | 功能建议
title: "✨ [FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先确认它落在模块的能力边界内：HyperAlarm 只作用于小米时钟（`com.android.deskclock`），
        其它应用的 Hook 不在范围内。
        Keep in mind the module only hooks the Xiaomi Clock app; hooks for other apps are out of scope.

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 | What problem does this solve
      description: 先讲场景，再讲方案。例如“我早上要跑签到脚本，但现在只能靠固定时间，希望……”
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的实现方式 | Proposed solution
      description: 界面上应该长什么样？行为上应该怎么表现？有替代方案也可以写。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过 | Workaround today
      description: 目前你是怎么勉强做到的？这能帮助我们判断优先级。
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 能力边界 | Scope
      options:
        - label: 这个建议只涉及小米时钟（闹钟 / 脚本 / 日志 / 模块界面），不要求 Hook 其它应用
          required: true
